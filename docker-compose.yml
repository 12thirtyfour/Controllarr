services:
  controllarr:
    image: ghcr.io/12thirtyfour/controllarr:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BRANCH: develop
        VERSION: 5.0.0.0
    container_name: controllarr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/Chicago
    ports:
      - "7050:7050"
    volumes:
      - ./config:/config
      - ./roms:/roms
      - ./downloads:/downloads
    restart: unless-stopped

  # Optional: Enterprise PostgreSQL 17 persistence (uncomment to use instead of embedded SQLite)
