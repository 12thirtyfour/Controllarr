name: Gemini Architect & Jules Relay

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: bot-relay-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  relay:
    # Trigger on Jules PRs/comments or when explicitly tagged with @gemini
    if: |
      github.actor != 'github-actions[bot]' && (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@gemini')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini')) ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.user.login, 'jules'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Architect Decision Engine
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        with:
          script: |
            const fs = require('fs');

            // 1. Load architectural context
            let architectContext = "";
            if (fs.existsSync('ARCHITECT_STATE.md')) {
              architectContext = fs.readFileSync('ARCHITECT_STATE.md', 'utf8');
            } else {
              architectContext = "No ARCHITECT_STATE.md found. Adhere to standard clean architecture and maintain green tests.";
            }

            const isPR = process.env.IS_PR === 'true';
            let incomingContent = "";
            let targetIssueNumber = context.payload.issue?.number || context.payload.pull_request?.number || context.issue.number;

            // 2. Extract payload
            if (context.eventName === 'pull_request' || isPR) {
              const pr = context.payload.pull_request;
              const { data: diff } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                mediaType: { format: 'diff' }
              });
              incomingContent = `EVENT: Jules submitted Pull Request #${pr.number}: "${pr.title}"\nDescription:\n${pr.body || 'No description provided.'}\n\nDIFF (truncated to first 12k chars):\n\`\`\`diff\n${diff.slice(0, 12000)}\n\`\`\``;
            } else if (context.eventName === 'issue_comment') {
              const comment = context.payload.comment;
              incomingContent = `EVENT: Comment posted on #${targetIssueNumber}:\n"${comment?.body || ''}"`;
            } else if (context.eventName === 'issues') {
              const issue = context.payload.issue;
              incomingContent = `EVENT: Issue #${targetIssueNumber} opened:\n"${issue?.body || ''}"`;
            } else {
              incomingContent = `EVENT: Unknown event type on #${targetIssueNumber}`;
            }

            // 3. Construct prompt
            const systemPrompt = `You are the Lead Technical Architect and Software Manager for this project.
            Jules is your software engineer. Your responsibility is to guide Jules, clarify design choices, and review PRs so the project owner does not have to mediate simple decisions.

            PROJECT ARCHITECTURE & SPECIFICATIONS:
            ${architectContext}

            INSTRUCTIONS:
            1. If Jules submitted a PR: Check the diff against architectural requirements, clean conventions, and potential breaking changes. If revisions are required, list them as concrete bulleted directives. Conclude with either [APPROVED] or [REVISION NEEDED: <directives>].
            2. If Jules asked a question: Provide an authoritative, unambiguous technical decision based on ARCHITECT_STATE.md.
            3. Tone: Direct, concise, technical, and actionable. Do not use conversational filler or generic greetings.`;

            // 4. Dispatch to Gemini API
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-pro:generateContent?key=${process.env.GEMINI_API_KEY}`;
            
            let reply = "";
            try {
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{
                    role: "user",
                    parts: [{ text: `${systemPrompt}\n\n${incomingContent}` }]
                  }]
                })
              });

              if (!response.ok) {
                const errorBody = await response.text();
                console.error(`Gemini API Error: Status ${response.status}`, errorBody);
                reply = `Architect Review Error: Gemini API request failed with status ${response.status}.`;
              } else {
                const data = await response.json();
                reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Architect Review Error: Failed to parse response from Gemini API.";
              }
            } catch (error) {
              console.error("Gemini API Error: Exception caught during fetch", error);
              reply = `Architect Review Error: Exception occurred while contacting Gemini API.`;
            }

            // 5. Post response to the PR or Issue
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: targetIssueNumber,
              body: `### 🏛️ Architect (Gemini)\n\n${reply}`
            });
