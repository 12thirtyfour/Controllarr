name: Gemini Architect & Jules Relay

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]

jobs:
  relay:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (
        (github.event_name == 'issues' && contains(github.event.issue.body, '@gemini')) ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@gemini')) ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.user.login, 'jules'))
      )
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Acknowledge Event
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              await github.rest.reactions.createForIssueComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: context.payload.comment.id,
                content: 'eyes'
              });
            }

      - name: Run Architect Decision Engine
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const fs = require('fs');

            const issueNumber = context.payload.issue?.number || context.payload.pull_request?.number || context.issue.number;

            // Load architectural state
            let archState = "";
            try {
              archState = fs.readFileSync('ARCHITECT_STATE.md', 'utf8');
            } catch (e) {
              archState = "No ARCHITECT_STATE.md found at repository root.";
            }

            // Extract context payload
            let incoming = "";
            if (context.eventName === 'issues') {
              incoming = `New Issue #${issueNumber}: ${context.payload.issue.title}\n\n${context.payload.issue.body || ''}`;
            } else if (context.eventName === 'issue_comment') {
              incoming = `Comment on Issue/PR #${issueNumber} by @${context.actor}:\n\n${context.payload.comment.body || ''}`;
            } else if (context.eventName === 'pull_request') {
              incoming = `Pull Request #${issueNumber} opened/updated by @${context.actor}:\nTitle: ${context.payload.pull_request.title}\nBody: ${context.payload.pull_request.body || ''}`;
            }

            const prompt = `System Instructions:
You are the lead architect and project manager for Controllarr.
Maintain the architectural source of truth based on ARCHITECT_STATE.md.
Give concise, authoritative instructions to Jules (the software engineer).

ARCHITECT_STATE.md:
${archState}

User Input:
${incoming}`;

            const apiKey = (process.env.GEMINI_API_KEY || '').trim();

            async function callGemini(model) {
              const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
              const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{
                    role: 'user',
                    parts: [{ text: prompt }]
                  }]
                })
              });
              if (!res.ok) {
                const errBody = await res.text();
                throw new Error(`HTTP ${res.status}: ${errBody}`);
              }
              const data = await res.json();
              return data.candidates?.[0]?.content?.parts?.[0]?.text;
            }

            let reply = "";
            try {
              try {
                reply = await callGemini('gemini-2.5-pro');
              } catch (primaryErr) {
                console.warn("Primary gemini-2.5-pro failed, falling back to gemini-2.5-flash:", primaryErr.message);
                reply = await callGemini('gemini-2.5-flash');
              }
              if (!reply) {
                reply = "Architect Review Error: Empty response payload received.";
              }
            } catch (err) {
              reply = `Architect Review Error: ${err.message}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `### 🏛️ Architect (Gemini)\n\n${reply}`
            });
