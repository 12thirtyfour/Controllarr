name: Build Backend
description: Builds the backend and packages it

inputs:
  branch:
    description: "Branch name for this build"
    required: true
  version:
    description: "Version number to build"
    required: true
  framework:
    description: ".net framework used for the build"
    required: true
  runtime:
    description: "Run time to build for"
    required: true
  package_tests:
    description: "True if tests should be packaged for later testing steps"

runs:
  using: "composite"
  steps:
    - name: Cache nuget packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/Directory.*.props') }}
        restore-keys:
          ${{ runner.os }}-nuget-

    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Setup NuGet registry source
      shell: bash
      if: ${{ startsWith(inputs.runtime, 'freebsd') }}
      run:
        dotnet nuget add source --configfile src/NuGet.Config --name gh-openur https://nuget.pkg.github.com/openur/index.json --username ${{ github.repository_owner }} --password ${{ github.token }} --store-password-in-clear-text

    - name: Setup Environment Variables
      id: variables
      shell: bash
      run: |
        echo "CONTROLLARR_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
        echo "BRANCH=${{ inputs.branch }}" >> "$GITHUB_ENV"

    - name: Enable Extra Platforms In SDK
      if: ${{ inputs.runtime == 'freebsd-x64' }}
      shell: bash
      run: |
        ACTUAL_SDK_DIR=$(ls -d /usr/share/dotnet/sdk/10.* 2>/dev/null | tail -n 1)
        if [ -z "$ACTUAL_SDK_DIR" ]; then
          ACTUAL_SDK_DIR="/usr/share/dotnet/sdk/$(dotnet --version)"
        fi
        BUNDLEDVERSIONS="${ACTUAL_SDK_DIR}/Microsoft.NETCoreSdk.BundledVersions.props"

        if [ -f "$BUNDLEDVERSIONS" ]; then
          if ! grep -q freebsd-x64 "$BUNDLEDVERSIONS"; then
            echo "Enabling extra platform support in $BUNDLEDVERSIONS"
            sed -i.ORI 's/osx-x64/osx-x64;freebsd-x64/' "$BUNDLEDVERSIONS"
          fi
        else
          echo "Warning: BundledVersions props not found at $BUNDLEDVERSIONS, skipping modification."
        fi

        if grep -qv freebsd-x64 src/Directory.Build.props; then
          sed -i'' -e "s^<RuntimeIdentifiers>\(.*\)</RuntimeIdentifiers>^<RuntimeIdentifiers>\1;freebsd-x64</RuntimeIdentifiers>^g" src/Directory.Build.props
        fi

    - name: Update Version Number
      shell: bash
      run: |
        if [ "$CONTROLLARR_VERSION" != "" ]; then
          echo "Updating version info to: $CONTROLLARR_VERSION"
          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$CONTROLLARR_VERSION<\/AssemblyVersion>/g" src/Directory.Build.props src/Controllarr.Common/Controllarr.Common.csproj
          sed -i'' -e "s/<AssemblyConfiguration>[\$()A-Za-z-]\+<\/AssemblyConfiguration>/<AssemblyConfiguration>${BRANCH}<\/AssemblyConfiguration>/g" src/Directory.Build.props src/Controllarr.Common/Controllarr.Common.csproj
          sed -i'' -e "s/<string>10.0.0.0<\/string>/<string>$CONTROLLARR_VERSION<\/string>/g" distribution/macOS/Sonarr.app/Contents/Info.plist
        fi

    - name: Build Backend
      shell: bash
      run: |
        runtime="${{ inputs.runtime }}"
        platform=Windows
        slnFile=src/Controllarr.sln
        targetingWindows=false

        IFS='-' read -ra SPLIT <<< "$runtime"

        if [ "${SPLIT[0]}" == "win" ]; then
          platform=Windows
          targetingWindows=true
        else
          platform=Posix
        fi

        rm -rf _output
        rm -rf _tests

        echo "Building Controllarr for $runtime, Platform: $platform"

        dotnet msbuild -restore $slnFile -p:SelfContained=true -p:Configuration=Release -p:Platform=$platform -p:RuntimeIdentifiers=$runtime -p:EnableWindowsTargeting=true -t:PublishAllRids

    - name: Package
      shell: bash
      run: |
        framework="${{ inputs.framework }}"
        runtime="${{ inputs.runtime }}"

        IFS='-' read -ra SPLIT <<< "$runtime"

        case "${SPLIT[0]}" in
          linux|freebsd*)
            folder=_artifacts/$runtime/$framework/Sonarr

            echo "Packaging files"
            rm -rf $folder
            mkdir -p $folder
            cp -r _output/$framework/$runtime/publish/* $folder
            cp -r _output/Controllarr.Update/$framework/$runtime/publish $folder/Controllarr.Update
            cp LICENSE.md $folder

            echo "Removing Service helpers"
            rm -f $folder/ServiceUninstall.*
            rm -f $folder/ServiceInstall.*

            echo "Removing Controllarr.Windows"
            rm $folder/Controllarr.Windows.*

            echo "Adding Controllarr.Mono to UpdatePackage"
            cp $folder/Controllarr.Mono.* $folder/Controllarr.Update
            cp $folder/Openur.Mono.Unix.* $folder/Controllarr.Update
            cp $folder/libMono.Unix.* $folder/Controllarr.Update
            ;;
          win)
            folder=_artifacts/$runtime/$framework/Sonarr

            echo "Packaging files"
            rm -rf $folder
            mkdir -p $folder
            cp -r _output/$framework/$runtime/publish/* $folder
            cp -r _output/Controllarr.Update/$framework/$runtime/publish $folder/Controllarr.Update
            cp LICENSE.md $folder
            cp -r _output/$framework-windows/$runtime/publish/* $folder

            echo "Removing Controllarr.Mono"
            rm -f $folder/Controllarr.Mono.*
            rm -f $folder/Openur.Mono.Unix.*
            rm -f $folder/libMono.Unix.*

            echo "Adding Controllarr.Windows to UpdatePackage"
            cp $folder/Controllarr.Windows.* $folder/Controllarr.Update

            ;;
          osx)
            folder=_artifacts/$runtime/$framework/Sonarr

            echo "Packaging files"
            rm -rf $folder
            mkdir -p $folder
            cp -r _output/$framework/$runtime/publish/* $folder
            cp -r _output/Controllarr.Update/$framework/$runtime/publish $folder/Controllarr.Update
            cp LICENSE.md $folder

            echo "Removing Service helpers"
            rm -f $folder/ServiceUninstall.*
            rm -f $folder/ServiceInstall.*

            echo "Removing Controllarr.Windows"
            rm $folder/Controllarr.Windows.*

            echo "Adding Controllarr.Mono to UpdatePackage"
            cp $folder/Controllarr.Mono.* $folder/Controllarr.Update
            cp $folder/Openur.Mono.Unix.* $folder/Controllarr.Update
            cp $folder/libMono.Unix.* $folder/Controllarr.Update
            ;;
        esac

    - name: Package Tests
      if: ${{ inputs.package_tests }}
      shell: bash
      run: |
        framework="${{ inputs.framework }}"
        runtime="${{ inputs.runtime }}"

        cp scripts/test.sh "_tests/$framework/$runtime/publish"

        rm -f _tests/$framework/$runtime/*.log.config

    - name: Upload Test Artifacts
      if: ${{ inputs.package_tests }}
      uses: ./.github/actions/publish-test-artifact
      with:
        framework: ${{ inputs.framework }}
        runtime: ${{ inputs.runtime }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-${{ inputs.runtime }}
        path: _artifacts/**/*
